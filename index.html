function decode(value) {
  const binary = atob(value);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function rewriteStorageImagesToFirestore(page, key) {
  if (key !== 'admin') return page;

  // รูปของจุดกิจกรรมต้องเก็บเป็น data URL ใน Firestore โดยตรง
  // แทนการอัปโหลดไป Firebase Storage และบันทึกลิงก์ดาวน์โหลด
  page = page.replace(
    'qrImageUrl, fmtDateThai, getSiteSettings, uploadImageToStorage, onAuthStateChanged',
    'qrImageUrl, fmtDateThai, getSiteSettings, compressImageFile, onAuthStateChanged'
  );
  page = page.replace(
    "let pPendingImageFile = null;",
    `let pPendingImageFile = null;
async function compressImageToDataUrl(file, opts = {}) {
  const blob = await compressImageFile(file, opts);
  return await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}`
  );
  page = page.replace(
    "imageUrl = await uploadImageToStorage(pPendingImageFile, `point_images/\${code}_\${Date.now()}.jpg`, { maxWidth: 1600, maxHeight: 900, quality: 0.72 });",
    "imageData = await compressImageToDataUrl(pPendingImageFile, { maxWidth: 1200, maxHeight: 675, quality: 0.65 });"
  );
  page = page.replace(
    "let imageUrl = '';",
    "let imageData = '';"
  );
  page = page.replace(
    "document.getElementById('p-image-status').textContent = 'กำลังบีบอัดและอัปโหลด...';",
    "document.getElementById('p-image-status').textContent = 'กำลังบีบอัดรูปภาพ...';"
  );
  page = page.replace(
    "{ name, code, active: true, imageUrl, createdAt: serverTimestamp() }",
    "{ name, code, active: true, imageData, createdAt: serverTimestamp() }"
  );
  page = page.replace(
    "${p.imageUrl ? `<img src=\"${p.imageUrl}\"",
    "${(p.imageData || p.imageUrl) ? `<img src=\"${p.imageData || p.imageUrl}\""
  );
  return page;
}

async function resolveTeacherPointCode(raw){
  const direct = extractPoint(raw);

  if (!/^https?:$/.test(target.protocol)) return '';

    }
  }

    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = event => {
        const img = new Image();
        img.onload = () => {
          let width = img.naturalWidth || img.width;
          let height = img.naturalHeight || img.height;
          if (width > maxWidth) {
            height = Math.round(height * maxWidth / width);
            width = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));

  }

  function enhance() {
    const doc = frameDocument();
    if (!doc) return;
    const page = location.hash.split('?')[0].replace('#', '');
    if (page === 'admin') enhanceAdmin(doc);
    if (page === 'workshop') enhanceWorkshop(doc);
    if (page === 'certificate') enhanceCertificate(doc);
  }

  view.addEventListener('load', () => setTimeout(enhance, 0));
  window.addEventListener('hashchange', () => setTimeout(enhance, 0));
  setTimeout(enhance, 300);
})();

</script>
</body>
</html>
